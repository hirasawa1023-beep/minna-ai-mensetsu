function stopAnalysisLoops(){if(audioTimer){clearInterval(audioTimer);audioTimer=null}if(faceTimer){clearInterval(faceTimer);faceTimer=null}try{audioSource?.disconnect()}catch{}try{audioAnalyser?.disconnect()}catch{}audioSource=null;audioAnalyser=null;if(audioContext){audioContext.close?.().catch(()=>{});audioContext=null}faceDetector=null}
function startAudioAnalysis(stream){stopAnalysisLoops();if(!state.analytics)state.analytics=freshAnalytics();const track=stream?.getAudioTracks?.()[0];if(!track||!window.AudioContext&&!window.webkitAudioContext)return;try{const AC=window.AudioContext||window.webkitAudioContext;audioContext=new AC();audioAnalyser=audioContext.createAnalyser();audioAnalyser.fftSize=1024;audioSource=audioContext.createMediaStreamSource(new MediaStream([track]));audioSource.connect(audioAnalyser);const data=new Uint8Array(audioAnalyser.fftSize);state.analytics.audioAvailable=true;audioTimer=setInterval(()=>{if(!audioAnalyser||!state.analytics)return;audioAnalyser.getByteTimeDomainData(data);let sum=0;for(const x of data){const v=(x-128)/128;sum+=v*v}const rms=Math.sqrt(sum/data.length);const a=state.analytics;a.audioSamples++;a.rmsSum+=rms;a.rmsMax=Math.max(a.rmsMax,rms);if(rms>.025)a.speakingSamples++;else a.quietSamples++;if(rms>.12)a.loudSamples++},120)}catch(e){console.warn('audio analysis unavailable',e)}}
async function startFaceAnalysis(){if(!('FaceDetector'in window))return;try{faceDetector=new FaceDetector({fastMode:true,maxDetectedFaces:1});state.analytics.videoAnalysisAvailable=true;faceTimer=setInterval(async()=>{const v=document.getElementById('selfCamera');if(!v||v.readyState<2||!faceDetector||!state.analytics)return;try{const faces=await faceDetector.detect(v);const a=state.analytics;a.faceChecks++;if(faces.length){a.faceVisible++;const b=faces[0].boundingBox,cx=b.x+b.width/2,cy=b.y+b.height/2,dx=Math.abs(cx-v.videoWidth/2)/(v.videoWidth||1),dy=Math.abs(cy-v.videoHeight/2)/(v.videoHeight||1);if(dx<.18&&dy<.22)a.faceCentered++}}catch{}},900)}catch(e){console.warn('face analysis unavailable',e)}}

function recordResponseMetrics(text){if(!state.analytics)return;const sec=Math.max(.5,(Date.now()-(state.questionShownAt||Date.now()))/1000);state.analytics.responseTimes.push(sec);state.analytics.answerChars.push(text.length);state.analytics.fillerCount+=(text.match(/えーと|えっと|あの[ー～]?|その[ー～]?|まあ/g)||[]).length}
function pct(n,d){return d?Math.round(n/d*100):0}
function autoAnalysis(){const a=state.analytics||freshAnalytics();const avgTime=a.responseTimes.length?Math.round(a.responseTimes.reduce((x,y)=>x+y,0)/a.responseTimes.length*10)/10:0;const totalChars=a.answerChars.reduce((x,y)=>x+y,0);const charsPerMin=a.responseTimes.reduce((x,y)=>x+y,0)?Math.round(totalChars/(a.responseTimes.reduce((x,y)=>x+y,0)/60)):0;const speaking=pct(a.speakingSamples,a.audioSamples);const tooLoud=pct(a.loudSamples,a.audioSamples);const faceVisible=pct(a.faceVisible,a.faceChecks);const centered=pct(a.faceCentered,a.faceChecks);return {avgTime,charsPerMin,speaking,tooLoud,faceVisible,centered,filler:a.fillerCount,audioAvailable:a.audioAvailable,videoAvailable:a.videoAnalysisAvailable}}

function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function questionStage(q){if(q.stage)return q.stage;if(q.id==='common001'||q.id==='common002'||/自己紹介を|名前と中学校名/.test(q.text))return 'opening';if(q.id==='common056'||/最後に伝えたい|最後に.*ありますか|何か質問はありますか/.test(q.text))return 'closing';return 'middle'}function orderQuestionSet(items,count){const opening=items.filter(q=>questionStage(q)==='opening');const middle=items.filter(q=>questionStage(q)==='middle');const closing=items.filter(q=>questionStage(q)==='closing');const result=[];if(opening[0])result.push(opening[0]);for(const q of middle)if(result.length<count-(closing.length?1:0))result.push(q);if(closing[0]&&result.length<count)result.push(closing[0]);for(const q of [...opening.slice(1),...middle,...closing.slice(1)])if(!result.some(x=>x.id===q.id)&&result.length<count)result.splice(Math.max(result.length-(closing[0]?1:0),0),0,q);return result.slice(0,count)}function buildQuestionSet(course){const active=questions.filter(q=>q.active!==false);const count=Number(course.count)||10;let pool=course.categories?.length?active.filter(q=>course.categories.includes(q.category)):active;const selected=[];const courseRequired=(course.requiredIds||[]).map(id=>active.find(q=>q.id===id)).filter(Boolean);const globalRequired=pool.filter(q=>q.required);const required=[...courseRequired,...globalRequired].filter((q,i,a)=>a.findIndex(x=>x.id===q.id)===i);for(const q of required)if(!selected.some(x=>x.id===q.id)&&selected.length<count)selected.push(q);if(course.mode==='random'){for(const q of shuffle(pool))if(!selected.some(x=>x.id===q.id)&&selected.length<count)selected.push(q)}else{const cats=[...new Set(pool.map(q=>q.category))];let rounds=0;while(selected.length<count&&rounds<20){for(const cat of shuffle(cats)){const options=shuffle(pool.filter(q=>q.category===cat&&!selected.some(x=>x.id===q.id)));if(options[0]&&selected.length<count)selected.push(options[0])}rounds++}}return orderQuestionSet(selected,count)}

function needsFollowup(q,a){const t=a.trim();if(!q.followup)return false;if(t.length<18)return true;const concrete=/たとえば|例えば|とき|時に|委員会|授業|行事|友達|先生|家で|説明会|見学|実習|仕事|理由|ため/.test(t);const conclusionOnly=/^(はい|いいえ|あります|ありません|です|好きです|苦手です)[。！]?$/ .test(t);return conclusionOnly||(!concrete&&t.length<45)}function makeFollowup(q,a){const c=characterProfile();const lead=a.trim().length<12?(c.followShort||'もう少し詳しく教えてください。'):(c.followSpecific||'具体的な出来事を教えてください。');return `${c.ack||''}${c.ack?' ':''}${lead} ${q.followup||''}`.trim()}

${q.text}`:q.text);const pct=((state.index+(isF?.5:0))/state.sessionQuestions.length)*100;return `<section class="card fade"><div class="course-banner"><strong>${esc(state.course.name)}</strong>　<span class="pill">${esc(q.category)}</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="interviewMain"><div>${state.cameraOn?persistentCamera():`<div class="cameraOff"><div><div style="font-size:3rem">📷</div><strong>カメラは停止しています</strong></div></div>`}<div class="cameraControls"><button class="btn ${state.cameraOn?'ghost':'secondary'}" onclick="toggleCamera()">${state.cameraOn?'📷 カメラを停止':'📷 カメラを起動'}</button><button class="btn ghost" onclick="speakCurrentQuestion(true)">🔊 質問を聞く</button></div></div><div><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="avatar" style="width:86px;height:86px;font-size:2.4rem;margin:0">${esc(state.char.icon)}</div><div><strong>${esc(state.char.name)}</strong><div class="small">基本質問 ${state.index+1} / ${state.sessionQuestions.length} ${isF?'・深掘り質問':''}<br><span class="mini">これまでに答えた質問：${state.totalAsked}</span></div></div></div><div class="speech">${esc(prompt)}</div>${state.hint>0&&!isF?`<div class="hint"><strong>ヒント</strong><br>${esc(q.hint)}</div>`:''}<div class="field"><textarea id="answer" placeholder="「音声入力」を押して話すと、認識された文字がここに入ります。必要に応じて修正できます。">${esc(state.currentAnswer)}</textarea><div class="micStatus ${state.transcribing?'listening':''}">${state.transcribing?'🎙️ 聞き取り中です。話し終わると自動で文字が入ります。':'「音声入力」を押して答えてください。入力された文字は手直しできます。'}</div></div><div class="row"><button class="btn ${state.transcribing?'danger':'secondary'}" onclick="toggleSpeechInput()">${state.transcribing?'■ 音声入力を停止':'🎙️ 音声入力'}</button><button class="btn primary" onclick="submitAnswer()">この回答で進む</button>${!isF?`<button class="btn secondary" onclick="showHint()">ヒント</button>`:''}<button class="btn ghost" onclick="skipQuestion()">スキップ</button><button class="btn danger" onclick="consultTeacher()">先生に相談</button></div></div></div></section>`}
function showHint(){state.currentAnswer=document.getElementById('answer').value;state.hint=1;render()}
function submitAnswer(){if(state.transcribing)return alert('先に音声入力を停止してください。');let a=document.getElementById('answer').value.trim();if(!a)return alert('音声入力またはキーボードで回答するか、スキップを選んでください。');recordResponseMetrics(a);stopSpeech();state.totalAsked++;if(state.phase==='main'){state.answers[state.index]={question:currentQuestion().text,category:currentQuestion().category,answer:a};if(needsFollowup(currentQuestion(),a)){state.followupQuestion=makeFollowup(currentQuestion(),a);state.phase='follow';state.currentAnswer='';state.hint=0;render()}else{nextQuestion()}}else{state.followups[state.index]={question:state.followupQuestion,answer:a};nextQuestion()}}
function skipQuestion(){stopSpeech();if(state.phase==='main')state.answers[state.index]={question:currentQuestion().text,category:currentQuestion().category,answer:'（スキップ）'};nextQuestion()}
function nextQuestion(){stopSpeech();state.index++;state.phase='main';state.currentAnswer='';state.hint=0;if(state.index>=state.sessionQuestions.length){stopCamera();saveSession();go('finish')}else render()}
function saveSession(){const records=store.get('mensetsu_records',[]);const valid=state.answers.filter(a=>a&&a.answer!=='（スキップ）'),avgChars=valid.length?Math.round(valid.reduce((n,a)=>n+(a.answer||'').length,0)/valid.length):0,specific=state.answers.filter((a,i)=>a&&a.answer!=='（スキップ）'&&detailedFeedback(state.sessionQuestions[i],a,state.followups[i]).specificity>=2).length;records.unshift({id:Date.now(),name:state.name,color:state.color,char:state.char.name,course:state.course.name,date:new Date().toLocaleString('ja-JP'),questionSet:state.sessionQuestions.map(q=>({id:q.id,text:q.text,category:q.category})),answers:state.answers,followups:state.followups,totalAsked:state.totalAsked,startMode:state.startMode,analytics:autoAnalysis(),summary:{answered:valid.length,avgChars,specific,followups:state.followups.filter(Boolean).length},teacherNote:''});store.set('mensetsu_records',records)}
function finishView(){const c=characterProfile();return `<section class="card scene fade"><div><div class="avatar">${esc(state.char.icon)}</div><h1>面接は終了です</h1><p class="muted">${esc(state.char.name)}「${esc(c.closing||'以上で面接を終わります。')}」</p><div class="notice success">「ありがとうございました」と伝え、礼をして退室しましょう。</div><div class="row center"><button class="btn primary" onclick="go('feedback')">フィードバックを見る</button><button class="btn ghost" onclick="go('home')">ホームへ戻る</button></div></div></section>`}
function textSignals(text){const t=(text||'').trim();return {len:t.length,hasReason:/なぜなら|理由|ので|から|ため/.test(t),hasExample:/例えば|とき|経験|出来事|具体的|委員会|行事|授業|友達|先生|家/.test(t),hasLearning:/学び|分かり|気づ|次は|今後|生か|頑張/.test(t),hasConclusion:/私の|私は|志望|得意|苦手|長所|短所|将来/.test(t)}}
function levelLabel(score){return score>=3?'とてもよい':score===2?'よい':score===1?'もう一歩':'練習しよう'}
function detailedFeedback(q,answer,follow){const a=(answer?.answer||'').trim(),f=(follow?.answer||'').trim(),combined=(a==='（スキップ）'?'':a)+' '+f,sig=textSignals(combined);if(a==='（スキップ）')return {relevance:0,specificity:0,structure:0,detail:'今回はスキップしました。分からないまま無理に答えず、先生に相談する選択ができました。',good:'困ったときに無理をしない判断ができました。',improve:'まずは「私は〜です。」の一文だけを準備し、次に理由を一つ加えましょう。',example:'私は〇〇です。理由は、〇〇した経験があるからです。'};let relevance=(sig.len>=8?1:0)+(sig.hasConclusion?1:0)+(sig.len>=30?1:0);let specificity=(sig.hasExample?2:0)+(sig.len>=55?1:0);let structure=(sig.hasConclusion?1:0)+(sig.hasReason?1:0)+(sig.hasLearning?1:0);relevance=Math.min(3,relevance);specificity=Math.min(3,specificity);structure=Math.min(3,structure);let good=[];if(relevance>=2)good.push('質問に沿って自分の考えを答えています');if(specificity>=2)good.push('経験や場面を交えて具体的に伝えています');if(structure>=2)good.push('結論と理由のつながりが分かりやすいです');if(!good.length)good.push('自分の言葉で答えようとしています');let improve=[];if(relevance<2)improve.push('最初に質問への答えを一文で伝える');if(specificity<2)improve.push('学校生活での出来事や自分の行動を一つ加える');if(structure<2)improve.push('「理由は〜だからです」で説明をつなぐ');if(!sig.hasLearning&&['学校生活','人との関わり','対応力','将来'].includes(q.category))improve.push('最後に学んだことや今後に生かしたいことを加える');return {relevance,specificity,structure,detail:`回答は${sig.len}文字でした。${f.trim()?`深掘りにも回答し、内容を補足できました。`:'深掘りがなかった場合も、次回は具体例まで一度に話せるとさらに良くなります。'}`,good:good.join('。')+'。',improve:improve.slice(0,2).join('。')+'。',example:'「結論」→「理由」→「具体的な出来事」→「学んだこと」の順に答えてみましょう。'} }
function overallFeedback(){const valid=state.answers.filter(a=>a&&a.answer!=='（スキップ）'),chars=valid.reduce((n,a)=>n+(a.answer||'').length,0)+state.followups.filter(Boolean).reduce((n,a)=>n+(a.answer||'').length,0),followCount=state.followups.filter(Boolean).length,skips=state.answers.filter(a=>a?.answer==='（スキップ）').length,avg=valid.length?Math.round(chars/valid.length):0;return {answered:valid.length,chars,followCount,skips,avg}}
function autoFeedbackHtml(){const x=autoAnalysis();const audio=x.audioAvailable?`<div class="rubricCard"><div class="small">声が出ていた割合</div><div class="rubricLevel">${x.speaking}%</div><div class="small">${analysisLevel(x.speaking,25,10)}（無音を含む面接全体の目安）</div></div><div class="rubricCard"><div class="small">話し始めるまでの平均</div><div class="rubricLevel">${x.avgTime}秒</div><div class="small">考える時間を含みます</div></div><div class="rubricCard"><div class="small">話す量の目安</div><div class="rubricLevel">約${x.charsPerMin}字/分</div><div class="small">回答欄の入力内容から算出</div></div><div class="rubricCard"><div class="small">大きすぎる音の割合</div><div class="rubricLevel">${x.tooLoud}%</div><div class="small">端末のマイク位置にも左右されます</div></div>`:`<div class="rubricCard"><div class="small">音声分析</div><div class="rubricLevel">判定なし</div><div class="small">マイク権限がない、または音声入力を利用できませんでした</div></div>`;const video=x.videoAvailable?`<div class="rubricCard"><div class="small">顔が確認できた割合</div><div class="rubricLevel">${x.faceVisible}%</div><div class="small">${analysisLevel(x.faceVisible,80,50)}</div></div><div class="rubricCard"><div class="small">顔が中央付近だった割合</div><div class="rubricLevel">${x.centered}%</div><div class="small">カメラ位置を整える目安です</div></div>`:`<div class="rubricCard"><div class="small">顔・目線分析</div><div class="rubricLevel">判定なし</div><div class="small">このブラウザは端末内の顔検出に対応していません。先生と一緒に確認してください。</div></div>`;return `<div class="rubricGrid">${audio}${video}<div class="rubricCard"><div class="small">言いよどみ語の回数</div><div class="rubricLevel">${x.filler}回</div><div class="small">回答欄に入力された「えーと」「あの」などの目安</div></div></div>`}
function feedbackView(){const ov=overallFeedback();const items=state.sessionQuestions.map((q,i)=>{const fb=detailedFeedback(q,state.answers[i],state.followups[i]);return `<div class="feedbackItem"><div class="tagrow"><span class="pill">${esc(q.category)}</span><span class="pill">評価観点：${esc(q.evaluation||'内容・伝え方')}</span></div><h3>${i+1}. ${esc(q.text)}</h3><p><strong>あなたの回答</strong><br>${esc(state.answers[i]?.answer||'未回答')}</p>${state.followups[i]?`<div class="notice info"><strong>深掘り質問</strong><br>${esc(state.followups[i].question)}<br><br><strong>深掘りへの回答</strong><br>${esc(state.followups[i].answer)}</div>`:''}<div class="rubricGrid"><div class="rubricCard"><div class="small">質問に合っているか</div><div class="rubricLevel">${levelLabel(fb.relevance)}</div></div><div class="rubricCard"><div class="small">具体的に話せているか</div><div class="rubricLevel">${levelLabel(fb.specificity)}</div></div><div class="rubricCard"><div class="small">答えの組み立て</div><div class="rubricLevel">${levelLabel(fb.structure)}</div></div></div><p class="small">${esc(fb.detail)}</p><div class="notice feedbackGood"><strong>よかったところ</strong><br>${esc(fb.good)}</div><div class="notice feedbackImprove"><strong>次に意識すること</strong><br>${esc(fb.improve)}<br><span class="small">答え方の型：${esc(fb.example)}</span></div></div>`}).join('');return `<section class="card fade"><h1>${esc(state.name)}さんの詳しいフィードバック</h1><div class="course-banner">コース：<strong>${esc(state.course.name)}</strong><br>開始方法：<strong>${state.startMode==='entrance'?'入室練習から':'質問から'}</strong></div><div class="scoreGrid"><div class="scoreCard"><div class="small">基本質問</div><div class="scoreValue">${state.sessionQuestions.length}</div></div><div class="scoreCard"><div class="small">深掘り質問</div><div class="scoreValue">${ov.followCount}</div></div><div class="scoreCard"><div class="small">合計質問数</div><div class="scoreValue">${state.totalAsked}</div></div><div class="scoreCard"><div class="small">回答した基本質問</div><div class="scoreValue">${ov.answered}</div></div></div><div class="feedbackSection"><h2>${esc(state.char.name)}からの全体コメント</h2><div class="notice success"><strong>よかったところ</strong><br>${esc(characterFeedbackTone('good'))}<br><br>${ov.followCount?`${ov.followCount}回の深掘り質問にも答え、内容を詳しくしようとできました。`:'基本質問に落ち着いて取り組みました。'} 回答は平均約${ov.avg}文字でした。</div><div class="notice feedbackImprove"><strong>次回の重点目標</strong><br>${esc(characterFeedbackTone('improve'))}<br><br>${ov.skips?'スキップした質問を先生と一緒に短い一文から準備しましょう。':'結論を先に伝えた後、理由と具体例を一つずつ加えてみましょう。'}</div></div><div class="feedbackSection"><h2>自動分析（目安）</h2>${autoFeedbackHtml()}<div class="notice info"><strong>プライバシーについて</strong><br>映像・音声ファイルは保存しません。録音は次の質問へ進むと端末のメモリーから破棄されます。面接中に端末内で音量や時間などを計算し、分析結果の数値だけを表示します。端末やブラウザが顔検出に対応していない場合、目線・顔位置は「判定なし」になります。</div></div><div class="feedbackSection"><h2>先生と確認する項目</h2><div class="selfCheck"><label><input type="checkbox">背筋を伸ばして座れた</label><label><input type="checkbox">質問を最後まで聞いてから答えた</label><label><input type="checkbox">言葉遣いや礼が丁寧だった</label><label><input type="checkbox">${state.startMode==='entrance'?'ノック・入室・着席の動きを確認できた':'質問開始前に姿勢を整えられた'}</label></div></div><div class="feedbackSection"><h2>質問ごとの振り返り</h2><div class="feedbackGrid">${items}</div></div><div class="row" style="margin-top:18px"><button class="btn primary" onclick="go('home')">ホームへ戻る</button></div></section>`}

function teacherLogin(){const p=prompt('先生用パスコードを入力してください。','');if(p===store.get('teacher_pin','1234'))go('teacher');else if(p!==null)alert('パスコードが違います。')}
function teacherView(){const tabs=[['dashboard','概要'],['growth','成長記録'],['questions','質問バンク'],['courses','コース管理'],['characters','面接官管理'],['records','全履歴']];return `<section class="card fade"><div class="toolbar"><div><h1 style="margin:0">先生用管理画面</h1><p class="muted" style="margin:4px 0">生徒の成長、質問バンク、コース、面接官、履歴を端末内で管理します。</p></div><button class="btn ghost" onclick="go('home')">終了</button></div><div class="tabs">${tabs.map(t=>`<button class="btn tab ${state.adminTab===t[0]?'active':''}" onclick="setAdminTab('${t[0]}')">${t[1]}</button>`).join('')}</div>${adminContent()}</section>`}

function recordSummary(r){if(r.summary)return r.summary;const valid=(r.answers||[]).filter(a=>a&&a.answer!=='（スキップ）'),avgChars=valid.length?Math.round(valid.reduce((n,a)=>n+(a.answer||'').length,0)/valid.length):0;return {answered:valid.length,avgChars,specific:0,followups:(r.followups||[]).filter(Boolean).length}}
function growthAdmin(){const rs=store.get('mensetsu_records',[]),names=[...new Set(rs.map(r=>r.name))].sort((a,b)=>a.localeCompare(b,'ja'));if(!names.length)return '<div class="notice info">成長記録はまだありません。面接練習を完了すると、ここに生徒ごとの記録が表示されます。</div>';if(!state.growthStudent||!names.includes(state.growthStudent))state.growthStudent=names[0];const selected=rs.filter(r=>r.name===state.growthStudent).slice().reverse(),latest=selected[selected.length-1],first=selected[0],ls=recordSummary(latest),fs=recordSummary(first),trend=(v1,v0,suffix='')=>{const d=(Number(v1)||0)-(Number(v0)||0);return `<span class="trend ${d>0?'up':d<0?'down':''}">${d>0?'＋':''}${d}${suffix}</span>`};return `<div class="growthHead"><div><h2 style="margin:0">生徒別の成長記録</h2><div class="small">自動分析は練習の目安です。合否判定には使用しません。</div></div><div style="min-width:260px"><label>生徒を選択</label><select class="select" onchange="selectGrowthStudent(this.value)">${names.map(n=>`<option ${n===state.growthStudent?'selected':''}>${esc(n)}</option>`).join('')}</select></div></div><div class="scoreGrid"><div class="scoreCard"><div class="small">練習回数</div><div class="scoreValue">${selected.length}</div></div><div class="scoreCard"><div class="small">平均回答文字数の変化</div><div class="scoreValue">${trend(ls.avgChars,fs.avgChars,'字')}</div></div><div class="scoreCard"><div class="small">回答できた質問数の変化</div><div class="scoreValue">${trend(ls.answered,fs.answered,'問')}</div></div><div class="scoreCard"><div class="small">深掘り回答数の変化</div><div class="scoreValue">${trend(ls.followups,fs.followups,'問')}</div></div></div><div class="growthList">${selected.slice().reverse().map((r,idx)=>growthSessionHtml(r,idx,selected.length)).join('')}</div>`}
function growthSessionHtml(r,idx,total){const sm=recordSummary(r),a=r.analytics||{},pct=v=>Math.max(0,Math.min(100,Number(v)||0));return `<div class="growthSession"><div class="toolbar"><div><strong>${esc(r.date)}</strong> <span class="pill">${esc(r.course||'標準')}</span><div class="small">${esc(r.char||'')}／${r.startMode==='entrance'?'入室練習から':'質問から'}</div></div><span class="pill">${total-idx}回目</span></div><div class="metricRow"><div class="metric"><span class="small">回答できた基本質問</span><strong>${sm.answered}問</strong></div><div class="metric"><span class="small">平均回答文字数</span><strong>${sm.avgChars}字</strong></div><div class="metric"><span class="small">具体的に話せた回答</span><strong>${sm.specific}問</strong></div><div class="metric"><span class="small">深掘り回答</span><strong>${sm.followups}問</strong></div></div>${a.audioAvailable?`<p class="small">声が出ていた割合 ${a.speaking||0}%</p><div class="barTrack"><div class="barFill" style="width:${pct(a.speaking)}%"></div></div>`:''}${a.videoAvailable?`<p class="small">顔が中央付近だった割合 ${a.centered||0}%</p><div class="barTrack"><div class="barFill" style="width:${pct(a.centered)}%"></div></div>`:''}<div class="field"><label><strong>先生コメント</strong></label><textarea class="teacherNote" id="note_${r.id}" placeholder="できたことや、次回の目標を入力してください。">${esc(r.teacherNote||'')}</textarea></div><div class="row"><button class="btn primary" onclick="saveTeacherNote('${r.id}')">コメントを保存</button><button class="btn ghost" onclick="showRecordDetail('${r.id}')">質問と回答を見る</button></div></div>`}

function speakCurrentQuestion(force=false){if(!('speechSynthesis'in window)||(!force&&!state.autoSpeak))return;const q=currentQuestion();if(!q)return;const lead=characterQuestionLead(state.phase==='follow');const text=state.phase==='follow'?state.followupQuestion:(lead?`${lead} ${q.text}`:q.text);speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=state.char?.rate||.9;u.pitch=state.char?.pitch||1;speechSynthesis.speak(u)}

function stopSpeechInput(doRender=false){
  recognitionToken++;
  const r=speechRecognition;speechRecognition=null;
  if(r){try{r.onresult=null;r.onerror=null;r.onend=null;r.abort()}catch{}}
  state.transcribing=false;
  if(doRender)render();
}
function toggleSpeechInput(){
  speechSynthesis?.cancel?.();
  if(state.transcribing){stopSpeechInput(true);return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return alert('このブラウザでは音声入力を利用できません。ChromeまたはEdgeの最新版で、start.batから起動してください。');
  const ta=document.getElementById('answer');
  state.currentAnswer=ta?.value||'';
  const baseText=state.currentAnswer.trim();
  const myToken=++recognitionToken;
  const myQuestionKey=`${state.index}:${state.phase}:${state.questionKey||currentQuestion()?.id||''}`;
  const r=new SR();speechRecognition=r;
  r.lang='ja-JP';r.continuous=false;r.interimResults=false;r.maxAlternatives=1;
  r.onresult=e=>{
    if(myToken!==recognitionToken)return;
    const currentKey=`${state.index}:${state.phase}:${state.questionKey||currentQuestion()?.id||''}`;
    if(myQuestionKey!==currentKey)return;
    let text='';
    for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)text+=e.results[i][0].transcript;
    text=text.trim();
    if(text){state.currentAnswer=(baseText?baseText+' ':'' )+text;}
  };
  r.onerror=e=>{
    if(myToken!==recognitionToken)return;
    state.transcribing=false;speechRecognition=null;
    render();
    const messages={
      'not-allowed':'マイクが許可されていません。アドレスバーのマイク設定を「許可」にしてください。',
      'service-not-allowed':'音声認識サービスを利用できません。ChromeまたはEdgeで、インターネット接続も確認してください。',
      'no-speech':'音声を聞き取れませんでした。マイクに近づき、もう一度ゆっくり話してください。',
      'audio-capture':'マイクを使用できませんでした。ほかのアプリがマイクを使用していないか確認してください。',
      'network':'音声認識サービスへ接続できませんでした。インターネット接続を確認してください。'
    };
    alert(messages[e.error]||'音声を文字にできませんでした。もう一度お試しください。');
  };
  r.onend=()=>{
    if(myToken!==recognitionToken)return;
    speechRecognition=null;state.transcribing=false;render();
  };
  try{state.transcribing=true;render();r.start()}catch{state.transcribing=false;speechRecognition=null;render();alert('音声入力を開始できませんでした。少し待ってから、もう一度押してください。')}
}

async function startCameraForInterview(){if(state.cameraOn&&cameraStream)return true;if(!navigator.mediaDevices?.getUserMedia)return false;try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});state.cameraOn=true;startAudioAnalysis(cameraStream);return true}catch(e){try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});state.cameraOn=true;return true}catch{state.cameraOn=false;return false}}}async function toggleCamera(){if(state.cameraOn){stopCamera();render();return}const ok=await startCameraForInterview();if(!ok)return alert('カメラを開始できませんでした。start.batから起動し、許可してください。');render()}function stopCamera(){cameraStream?.getTracks().forEach(t=>t.stop());cameraStream=null;state.cameraOn=false;stopAnalysisLoops()}function stopSpeech(){stopSpeechInput(false);state.listening=false;speechSynthesis?.cancel?.()}
